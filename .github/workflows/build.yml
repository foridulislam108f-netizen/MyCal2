name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Unzip project
        run: unzip -q MyCal2.zip
      - name: Build
        working-directory: MyCalApp
        run: gradle assembleDebug --no-daemon
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp MyCalApp/app/build/outputs/apk/debug/app-debug.apk MyCal.apk
          gh release delete apk --yes --cleanup-tag || true
          gh release create apk MyCal.apk --title "MyCal APK" --notes "MyCal 10.0.5"
